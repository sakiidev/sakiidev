name: Update Discord Status

on:
  schedule:
    - cron: '*/5 * * * *'  # A cada 5 minutos
  workflow_dispatch:

jobs:
  update-readme:
    name: Update Discord Status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Discord Presence
        uses: nizarmah/discord-readme@master
        with:
          DISCORD_USER_ID: 1458632297380057316
